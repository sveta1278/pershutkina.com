# Роли. Для каждой scripts/build.py собирает страницу /<slug>/ и /ru/<slug>/.
# slug: адрес страницы; pdf: файл в cv/; cases: id кейсов из content/cases.toml по порядку.
# Первые три кейса показываются целиком, остальные коротким списком «Ещё кейсы».
# recognition: 1–3 строки признания под роль (необязательно).
# Название роли одно на оба языка (как в PDF), остальное переводится.
# Порядок ролей здесь = порядок на страницах CV и кейсов.

