# Банк кейсов. Из этого файла scripts/build.py собирает /cases/ и страницы ролей.
# Каждый кейс: id (он же якорь в адресе), организация, период, метрики, стек
# и тексты на двух языках. В текстах можно писать HTML (ссылки, <i>).
# Порядок кейсов здесь = порядок на странице /cases/.
# Какие кейсы показывать на странице роли, задаётся в content/roles.toml.

[[cases]]
id = "analytics-foundation"
org = "Whoosh"
when = { en = "2025 – now", ru = "2025 – сейчас" }
stack = "SQL, dbt, Dagster, Amazon Redshift, Athena, S3, Power BI, Git"
metrics = [
  { value = "50+", en = "reusable data models", ru = "переиспользуемых моделей данных" },
  { value = "100+", en = "employees use the reporting", ru = "сотрудников пользуются отчётностью" },
]
[cases.en]
title = "Analytics foundation from zero"
problem = "Whoosh runs in 7 countries and 100+ regions, and reporting relied on manual exports without shared KPI definitions."
actions = [
  "Designed a warehouse and 50+ reusable dbt models orchestrated in Dagster that join fleet telemetry, behavioural and financial data.",
  "Built a metric tree with agreed KPI definitions for customer experience, fleet reliability and finance.",
  "Replaced manual exports with scheduled dashboards and email updates.",
  "Now own the analytics roadmap and metric standards and lead two analysts.",
]
result = "Automated reporting is used by 100+ employees for daily action plans and performance reviews."
[cases.ru]
title = "Аналитика с нуля"
problem = "Whoosh работает в 7 странах и 100+ регионах, а отчёты собирались вручную из выгрузок, без общих определений KPI."
actions = [
  "Спроектировала хранилище и 50+ переиспользуемых моделей в dbt под управлением Dagster: телеметрия флота, поведенческие и финансовые данные в одном месте.",
  "Собрала дерево метрик с согласованными определениями KPI для клиентского опыта, надёжности флота и финансов.",
  "Заменила ручные выгрузки дашбордами по расписанию и рассылками.",
  "Сейчас отвечаю за роадмап аналитики и стандарты метрик, руковожу двумя аналитиками.",
]
result = "Автоматической отчётностью пользуются 100+ сотрудников: по ней строят ежедневные планы и разбирают результаты."

